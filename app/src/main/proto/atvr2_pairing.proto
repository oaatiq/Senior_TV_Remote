// Android TV Remote Service protocol v2 - pairing channel (TLS, default port 6467).
//
// Schema as used by the open-source androidtvremote2 client. Wire compatibility with the
// target TV must be confirmed on real hardware (see docs/COMPATIBILITY_REPORT.md).
syntax = "proto2";

package atvr2.pairing;

option java_package = "app.seniorremote.protocol.atvr2.proto";
option java_multiple_files = true;

message PairingMessage {
  enum Status {
    STATUS_UNKNOWN = 0;
    STATUS_OK = 200;
    STATUS_ERROR = 400;
    STATUS_BAD_CONFIGURATION = 401;
    STATUS_BAD_SECRET = 402;
  }

  optional int32 protocol_version = 1;
  optional Status status = 2;
  optional int32 request_case = 3;
  optional PairingRequest pairing_request = 10;
  optional PairingRequestAck pairing_request_ack = 11;
  optional PairingOption pairing_option = 20;
  optional PairingConfiguration pairing_configuration = 30;
  optional PairingConfigurationAck pairing_configuration_ack = 31;
  optional PairingSecret pairing_secret = 40;
  optional PairingSecretAck pairing_secret_ack = 41;
}

message PairingRequest {
  optional string service_name = 1;
  optional string client_name = 2;
}

message PairingRequestAck {
  optional string server_name = 1;
}

message PairingEncoding {
  enum EncodingType {
    ENCODING_TYPE_UNKNOWN = 0;
    ENCODING_TYPE_ALPHANUMERIC = 1;
    ENCODING_TYPE_NUMERIC = 2;
    ENCODING_TYPE_HEXADECIMAL = 3;
    ENCODING_TYPE_QRCODE = 4;
  }

  optional EncodingType type = 1;
  optional uint32 symbol_length = 2;
}

enum RoleType {
  ROLE_TYPE_UNKNOWN = 0;
  ROLE_TYPE_INPUT = 1;
  ROLE_TYPE_OUTPUT = 2;
}

message PairingOption {
  repeated PairingEncoding input_encodings = 1;
  repeated PairingEncoding output_encodings = 2;
  optional RoleType preferred_role = 3;
}

message PairingConfiguration {
  optional PairingEncoding encoding = 1;
  optional RoleType client_role = 2;
}

message PairingConfigurationAck {
}

message PairingSecret {
  optional bytes secret = 1;
}

message PairingSecretAck {
  optional bytes secret = 1;
}
